[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopranos"
version = "0.1.0"
description = "Scene-indexed query database for The Sopranos"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "faster-whisper>=1.0",
  "scenedetect[opencv]>=0.6.4",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13",
  "tqdm>=4.66",
  "pydantic>=2.7",
  "sentence-transformers>=2.7",
  "sqlite-vec>=0.1.6",
  "flask>=3.0",
]

[project.scripts]
sopranos = "sopranos.cli:app"

[tool.setuptools.packages.find]
include = ["sopranos*"]
