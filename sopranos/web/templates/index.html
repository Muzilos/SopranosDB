<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SopranosDB</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #111; --fg: #e8e6e1; --muted: #8a8680; --accent: #c19a4b;
    --card: #1a1a1a; --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.4;
  }
  header {
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 16px 24px; z-index: 10;
  }
  h1 { margin: 0 0 12px; font-size: 22px; color: var(--accent); }
  h1 span { color: var(--muted); font-weight: normal; font-size: 14px; margin-left: 8px; }
  form { display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1; padding: 10px 14px; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; font-size: 15px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  input[type=number] {
    width: 70px; padding: 10px; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; font-size: 15px;
  }
  button {
    padding: 10px 20px; background: var(--accent); color: #111;
    border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .status { color: var(--muted); margin-bottom: 16px; font-size: 13px; }
  .result {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .result-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px; gap: 16px; flex-wrap: wrap;
  }
  .play-btn {
    padding: 6px 12px; background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: normal;
  }
  .play-btn:hover { background: var(--accent); color: #111; }
  .play-btn:disabled { opacity: 0.5; cursor: wait; }
  .parsed-filter {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .parsed-filter summary { cursor: pointer; color: var(--muted); }
  .parsed-filter table { width: 100%; margin-top: 8px; border-collapse: collapse; }
  .parsed-filter td { padding: 2px 8px; vertical-align: top; font-family: monospace; font-size: 12px; }
  .parsed-filter td:first-child { color: var(--muted); width: 200px; }
  .relaxed {
    background: #2a1f10; border: 1px solid #6b4d1f; color: #d4a55a;
    padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px;
  }
  .filters {
    margin-top: 12px; padding: 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .filters summary {
    cursor: pointer; color: var(--muted); font-size: 13px; user-select: none;
  }
  .filters[open] summary { margin-bottom: 12px; color: var(--accent); }
  .filter-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px 14px;
  }
  .filter-grid label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--muted);
  }
  .filter-grid select, .filter-grid input[type=number] {
    background: #0c0c0c; color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font-size: 13px;
  }
  .filter-grid select[multiple] { height: 96px; }
  .filter-actions {
    display: flex; gap: 8px; margin-top: 12px; align-items: center;
  }
  .filter-actions .badge {
    color: var(--muted); font-size: 12px; margin-left: auto;
  }
  .ghost-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .ghost-btn:hover { color: var(--fg); border-color: var(--accent); }
  .ep { color: var(--accent); font-weight: 600; }
  .ts { color: var(--muted); font-family: monospace; font-size: 13px; }
  .sim { color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .meta strong { color: var(--fg); font-weight: normal; }
  .summary { margin: 8px 0; }
  .dialogue {
    font-style: italic; color: var(--muted); border-left: 2px solid var(--border);
    padding: 4px 12px; margin: 8px 0; font-size: 14px;
  }
  details { margin-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details pre {
    white-space: pre-wrap; font-size: 12px; color: var(--muted);
    background: #0c0c0c; padding: 8px; border-radius: 4px; margin: 8px 0;
    max-height: 240px; overflow-y: auto;
  }
  .keyframes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .keyframes img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px;
    cursor: pointer; background: #000;
  }
  .keyframes img:hover { opacity: 0.85; }
  .empty { color: var(--muted); text-align: center; padding: 40px; font-style: italic; }
  .reasons { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .reasons span {
    background: #222; padding: 2px 6px; border-radius: 3px; margin-right: 4px;
    display: inline-block;
  }
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 100; justify-content: center; align-items: center; cursor: pointer;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 95vh; }
</style>
</head>
<body>
<header>
  <h1>SopranosDB <span>scene-indexed search</span></h1>
  <form id="search-form">
    <input type="text" id="q" placeholder="e.g. Tony and three men eating dinner at a restaurant (or leave blank and use filters)" />
    <input type="number" id="top" value="10" min="1" max="150" title="Top N results" />
    <label style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap;">
      <input type="checkbox" id="local" /> Local parser (free)
    </label>
    <button id="go" type="submit">Search</button>
  </form>

  <details class="filters" id="filters">
    <summary>Filters <span id="filter-count" style="color:var(--muted)"></span></summary>
    <div class="filter-grid" id="filter-grid">
      <!-- populated by JS -->
    </div>
    <div class="filter-actions">
      <button type="button" class="ghost-btn" id="filter-clear">Clear filters</button>
      <span class="badge">Dropdowns override the natural-language parser. Empty query + filters = pure structured search.</span>
    </div>
  </details>
</header>
<main>
  <div class="status" id="status">Enter a query above to search ~8,000 indexed scenes.</div>
  <div id="results"></div>
</main>

<div id="lightbox"><img id="lightbox-img" /></div>

<script>
const $ = (s) => document.querySelector(s);
const form = $("#search-form");
const status = $("#status");
const results = $("#results");
const lightbox = $("#lightbox");
const lightboxImg = $("#lightbox-img");

lightbox.addEventListener("click", () => lightbox.classList.remove("show"));

// --- filter dropdowns ---

const FILTER_SPECS = [
  // [param name, label, kind, options-key]
  ["characters",          "Required characters",  "multi",  "characters"],
  ["excluded_characters", "Excluded characters",  "multi",  "characters"],
  ["location_types",      "Location type",        "multi",  "location_types"],
  ["activities",          "Activities",           "multi",  "activities"],
  ["topics",              "Topics",               "multi",  "topics"],
  ["time_of_day",         "Time of day",          "single", "times_of_day"],
  ["location_interior_exterior", "Interior/Exterior", "single", "interior_exterior"],
  ["mood",                "Mood",                 "single", "moods"],
  ["violence_level",      "Violence level",       "single", "violence_levels"],
  ["min_group_size",      "Min group size",       "number", null],
  ["max_group_size",      "Max group size",       "number", null],
];

function buildFilterUI(options) {
  const grid = $("#filter-grid");
  grid.innerHTML = FILTER_SPECS.map(([name, label, kind, optKey]) => {
    if (kind === "number") {
      return `<label>${label}
        <input type="number" min="1" max="50" data-filter="${name}" />
      </label>`;
    }
    const opts = (options[optKey] || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    const multi = kind === "multi" ? "multiple" : "";
    const empty = kind === "single" ? `<option value="">— any —</option>` : "";
    return `<label>${label}
      <select data-filter="${name}" ${multi}>${empty}${opts}</select>
    </label>`;
  }).join("");

  grid.addEventListener("change", updateFilterCount);
  $("#filter-clear").addEventListener("click", () => {
    grid.querySelectorAll("[data-filter]").forEach(el => {
      if (el.tagName === "SELECT" && el.multiple) {
        [...el.options].forEach(o => o.selected = false);
      } else { el.value = ""; }
    });
    updateFilterCount();
  });
}

function readFilters() {
  const out = {};
  document.querySelectorAll("#filter-grid [data-filter]").forEach(el => {
    const name = el.dataset.filter;
    if (el.tagName === "SELECT" && el.multiple) {
      const vals = [...el.selectedOptions].map(o => o.value).filter(Boolean);
      if (vals.length) out[name] = vals.join(",");
    } else if (el.value) {
      out[name] = el.value;
    }
  });
  return out;
}

function updateFilterCount() {
  const f = readFilters();
  const n = Object.keys(f).length;
  $("#filter-count").textContent = n ? `(${n} active)` : "";
  if (n > 0) $("#filters").open = true;
}

(async () => {
  try {
    const r = await fetch("/api/filter_options");
    const opts = await r.json();
    buildFilterUI(opts);
  } catch (err) {
    console.error("Failed to load filter options:", err);
  }
})();

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderParsed(p) {
  if (!p) return "";
  const rows = [];
  const fmt = (v) => Array.isArray(v) ? (v.length ? v.join(", ") : "—") : (v == null ? "—" : String(v));
  const fields = [
    ["required_characters", "Characters required"],
    ["excluded_characters", "Characters excluded"],
    ["min_group_size", "Min group size"],
    ["max_group_size", "Max group size"],
    ["location_types", "Location types"],
    ["location_interior_exterior", "Interior/Exterior"],
    ["time_of_day", "Time of day"],
    ["mood", "Mood"],
    ["violence_level", "Violence"],
    ["activities", "Activities"],
    ["topics", "Topics"],
    ["tags", "Tags"],
    ["objects", "Objects"],
    ["semantic_query", "Semantic paraphrase"],
  ];
  for (const [k, label] of fields) {
    const v = p[k];
    const isEmpty = v == null || (Array.isArray(v) && !v.length) || v === "";
    if (isEmpty) continue;
    rows.push(`<tr><td>${esc(label)}</td><td>${esc(fmt(v))}</td></tr>`);
  }
  if (!rows.length) return "";
  return `<details class="parsed-filter"><summary>How your query was parsed (${rows.length} fields)</summary><table>${rows.join("")}</table></details>`;
}

function renderHit(h, i) {
  const chars = (h.characters || []).join(", ") || "—";
  const loc = h.location_name || "—";
  const dialogue = h.dialogue_highlight
    ? `<div class="dialogue">${esc(h.dialogue_highlight)}</div>` : "";
  const reasons = (h.reasons || []).length
    ? `<div class="reasons">${h.reasons.map(r => `<span>${esc(r)}</span>`).join("")}</div>`
    : "";
  const transcript = h.transcript_text
    ? `<details><summary>Transcript</summary><pre>${esc(h.transcript_text)}</pre></details>` : "";
  const keyframes = (h.keyframes || []).map(
    url => `<img src="${esc(url)}" data-full="${esc(url)}" loading="lazy" />`
  ).join("");
  return `
    <div class="result">
      <div class="result-head">
        <div><span class="ep">#${i+1} ${esc(h.episode_code)}</span> ${esc(h.title)}</div>
        <div class="ts">${esc(h.start_hms)} – ${esc(h.end_hms)}</div>
        <div class="sim">sim ${h.similarity.toFixed(3)}</div>
        <button class="play-btn" data-scene-id="${h.scene_id}" type="button">▶ Play</button>
      </div>
      <div class="meta"><strong>Location:</strong> ${esc(loc)} &nbsp; <strong>Characters:</strong> ${esc(chars)}</div>
      <div class="summary">${esc(h.summary || "")}</div>
      ${dialogue}
      ${reasons}
      <div class="keyframes">${keyframes}</div>
      ${transcript}
    </div>
  `;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  const filters = readFilters();
  if (!q && !Object.keys(filters).length) {
    status.textContent = "Enter a query or select at least one filter.";
    return;
  }
  const top = $("#top").value;
  $("#go").disabled = true;
  status.textContent = "Searching…";
  results.innerHTML = "";

  try {
    const t0 = performance.now();
    const params = new URLSearchParams({ q, top });
    if ($("#local").checked) params.set("local", "1");
    for (const [k, v] of Object.entries(filters)) params.set(k, v);
    const r = await fetch(`/api/search?${params.toString()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const ms = Math.round(performance.now() - t0);

    if (!data.hits.length) {
      status.textContent = `No matching scenes (${ms}ms).`;
      results.innerHTML = `<div class="empty">No results.</div>`;
    } else {
      status.textContent = `${data.hits.length} results in ${ms}ms · parser: ${data.parser || "llm"}.`;
      let prefix = "";
      if (data.relaxed && data.relaxed.length) {
        prefix += `<div class="relaxed">⚠ No scenes matched the strict filter — relaxed: <strong>${data.relaxed.map(esc).join(", ")}</strong></div>`;
      }
      prefix += renderParsed(data.parsed);
      results.innerHTML = prefix + data.hits.map(renderHit).join("");
      results.querySelectorAll(".keyframes img").forEach(img => {
        img.addEventListener("click", () => {
          lightboxImg.src = img.dataset.full;
          lightbox.classList.add("show");
        });
      });
      results.querySelectorAll(".play-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          const orig = btn.textContent;
          btn.textContent = "Launching…";
          try {
            const r = await fetch(`/api/play/${btn.dataset.sceneId}`, { method: "POST" });
            const j = await r.json();
            if (!j.ok) throw new Error(j.error || "play failed");
            btn.textContent = "▶ Playing";
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
          } catch (err) {
            btn.textContent = `✗ ${err.message}`;
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 3000);
          }
        });
      });
    }
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
  } finally {
    $("#go").disabled = false;
  }
});
</script>
</body>
</html>
