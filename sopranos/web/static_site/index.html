<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SopranosDB</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<header>
  <div class="titlebar">
    <h1><a href="#/">Sopranos<span class="mark">DB</span></a></h1>
    <p class="tagline">8,082 scenes. 86 episodes. Whaddya lookin' for?</p>
  </div>
  <nav id="nav">
    <a href="#/">Search</a>
    <a href="#/episodes">Episodes</a>
    <a href="#/characters">Characters</a>
  </nav>

  <form id="search-form">
    <input type="text" id="q" placeholder="keywords — e.g. gabagool, therapy, boat… (or just work the filters)" />
    <input type="number" id="top" value="25" min="1" max="200" title="Max results" />
    <button id="go" type="submit">Search</button>
  </form>

  <div class="active-bar" id="active-bar"><!-- active filter pills, populated by JS --></div>

  <details class="filters" id="filters">
    <summary>
      <span class="filters-caret" aria-hidden="true">▸</span>
      Filters <span class="filter-count" id="filter-count"></span>
    </summary>
    <div class="filter-grid" id="filter-grid"><!-- populated by JS --></div>
    <div class="filter-actions">
      <button type="button" class="ghost-btn" id="filter-clear">Clear filters</button>
      <span class="badge">Keywords rank by full-text relevance. Filters are exact — pick from a list and they stack up as removable tags. Leave the box empty to browse by filters alone.</span>
    </div>
  </details>
</header>

<main>
  <div class="status" id="status">Loading database…</div>
  <div id="results"></div>
</main>

<div id="lightbox"><img id="lightbox-img" alt="" /></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
